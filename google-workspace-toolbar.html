<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TagFox — Google toolbar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px system-ui, Segoe UI, sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #f1f3f4;
      border-bottom: 1px solid #dadce0;
      height: 100vh;
      overflow: hidden;
    }
    button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #fff;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 5px 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font: inherit;
    }
  </style>
</head>
<body>
  <button type="button" id="back" title="Back">←</button>
  <button type="button" id="fwd" title="Forward">→</button>
  <button type="button" id="reload" title="Reload">↻</button>
  <input type="text" id="url" spellcheck="false" autocomplete="off" placeholder="https://docs.google.com/…" />
  <script>
    const urlEl = document.getElementById('url');
    const btnBack = document.getElementById('back');
    const btnFwd = document.getElementById('fwd');
    btnBack.onclick = () => window.gwsToolbar.back();
    document.getElementById('fwd').onclick = () => window.gwsToolbar.forward();
    document.getElementById('reload').onclick = () => window.gwsToolbar.reload();
    urlEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.gwsToolbar.go(urlEl.value.trim());
    });
    window.gwsToolbar.onUrl((u) => {
      urlEl.value = u;
    });
    window.gwsToolbar.onNavState((s) => {
      btnBack.disabled = !s.canGoBack;
      btnFwd.disabled = !s.canGoForward;
    });
  </script>
</body>
</html>
