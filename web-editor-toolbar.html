<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TagFox — editor toolbar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px system-ui, Segoe UI, sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #f1f3f4;
      border-bottom: 1px solid #dadce0;
      height: 100vh;
      overflow: hidden;
    }
    button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #fff;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 5px 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font: inherit;
    }
    /* Names the document in the toolbar as well as the title bar, since a window parked at the
       screen edge can have its title bar off screen. Bounded so it never crowds out the address bar. */
    #docLabel {
      flex: 0 1 auto;
      max-width: 40%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: #202124;
      padding-left: 2px;
    }
    #docLabel:empty {
      display: none;
    }
  </style>
</head>
<body>
  <button type="button" id="back" title="Back">←</button>
  <button type="button" id="fwd" title="Forward">→</button>
  <button type="button" id="reload" title="Reload">↻</button>
  <button type="button" id="restoreSatellite" title="Expand Google’s minimized panel — simulates clicks on the tiny bottom bar">Expand</button>
  <span id="docLabel" title=""></span>
  <input type="text" id="url" spellcheck="false" autocomplete="off" placeholder="https://…" />
  <script>
    /* Main passes the window kind's toolbar options as a query string (see openWebEditorWindow):
       the Expand button is Google-only, the placeholder names the host set the address bar accepts. */
    const params = new URLSearchParams(location.search);
    const urlEl = document.getElementById('url');
    const btnBack = document.getElementById('back');
    const btnFwd = document.getElementById('fwd');
    const btnExpand = document.getElementById('restoreSatellite');
    if (params.get('expand') !== '1') btnExpand.remove();
    else btnExpand.onclick = () => window.webEditorToolbar.restoreSatellite();
    if (params.get('placeholder')) urlEl.placeholder = params.get('placeholder');
    btnBack.onclick = () => window.webEditorToolbar.back();
    btnFwd.onclick = () => window.webEditorToolbar.forward();
    document.getElementById('reload').onclick = () => window.webEditorToolbar.reload();
    urlEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.webEditorToolbar.go(urlEl.value.trim());
    });
    /* Main asks this page to draw the window icon, because a canvas is the only text rasteriser we
       have and the minimised stub's icon is the only place a name can appear on it. Two letters, set
       as large as a 16px square allows: anything smaller is unreadable on Steve's screen, which is
       what three across and six stacked both proved. Light ground, dark letters, so it reads on a
       dark caption and a light one. */
    window.__tagfoxDrawWindowIcon = (abbrev) => {
      const text = String(abbrev || '');
      const draw = (px) => {
        const c = document.createElement('canvas');
        c.width = px;
        c.height = px;
        const g = c.getContext('2d');
        g.fillStyle = '#f5f5f7';
        g.fillRect(0, 0, px, px);
        g.fillStyle = '#1f1f36';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        /* Grow until the pair fills the width; a 1px margin each side is all the square can spare. */
        const maxW = px - 2;
        let size = Math.round(px * 0.95);
        for (; size > 3; size--) {
          g.font = '700 ' + size + 'px Segoe UI, system-ui, sans-serif';
          if (g.measureText(text).width <= maxW) break;
        }
        g.fillText(text, px / 2, px / 2 + Math.round(px * 0.06));
        return c.toDataURL('image/png');
      };
      return { px16: draw(16), px32: draw(32) };
    };

    const labelEl = document.getElementById('docLabel');
    window.webEditorToolbar.onLabel((s) => {
      labelEl.textContent = s || '';
      labelEl.title = s || '';
    });
    window.webEditorToolbar.onUrl((u) => {
      urlEl.value = u;
    });
    window.webEditorToolbar.onNavState((s) => {
      btnBack.disabled = !s.canGoBack;
      btnFwd.disabled = !s.canGoForward;
    });
  </script>
</body>
</html>
